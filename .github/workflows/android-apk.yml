name: AGE OF TITANS - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --licenses </dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          include-templates: true
          use-dotnet: false

      - name: Configure Godot Android Editor Settings
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.android" "$HOME/.config/godot"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Godot 4.3 stores global editor settings in editor_settings-4.tres.
          # These paths are required by the Android exporter.
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF2

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$JAVA_HOME/bin/java"
          test -f "$ANDROID_HOME/platform-tools/adb"
          test -f "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -f "$HOME/.android/debug.keystore"
          test -s "$HOME/.config/godot/editor_settings-4.tres"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Remove nested Godot project
        shell: bash
        run: |
          if [ -f godot/project.godot ]; then
            rm -rf godot
          fi

      - name: Validate project and export preset
        shell: bash
        run: |
          set -e
          godot --version
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/Main.tscn
          test -f scripts/main.gd

          echo '--- export_presets.cfg ---'
          cat export_presets.cfg

      - name: Import Godot project
        shell: bash
        run: |
          set -e
          godot --headless --path . --editor --import --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -e
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug "Android" \
            build/AGE-OF-TITANS.apk

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -s build/AGE-OF-TITANS.apk
          file build/AGE-OF-TITANS.apk
          ls -lh build/AGE-OF-TITANS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AGE-OF-TITANS-APK
          path: build/AGE-OF-TITANS.apk
          if-no-files-found: error
