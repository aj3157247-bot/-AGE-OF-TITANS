name: AGE OF TITANS - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          include-templates: true
          use-dotnet: false

      - name: Configure Android environment
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}"

          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          adb start-server

      - name: Remove nested Godot project
        shell: bash
        run: |
          if [ -d "godot" ] && [ -f "godot/project.godot" ]; then
            rm -rf godot
          fi

      - name: Verify project
        shell: bash
        run: |
          test -f project.godot
          test -f export_presets.cfg
          godot --version
          echo "Android SDK: ${ANDROID_SDK_ROOT}"
          echo "Java: ${JAVA_HOME}"

      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug "Android" \
            build/AGE-OF-TITANS.apk

      - name: Verify APK
        shell: bash
        run: |
          test -f build/AGE-OF-TITANS.apk
          ls -lh build/AGE-OF-TITANS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AGE-OF-TITANS-APK
          path: build/AGE-OF-TITANS.apk
          if-no-files-found: error
