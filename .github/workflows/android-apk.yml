name: AGE OF TITANS - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-34"             "build-tools;34.0.0"             "cmdline-tools;latest"             "cmake;3.10.2.4988404"             "ndk;23.2.8568313"

      - name: Setup Godot 4.3 with Android templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          include-templates: true
          use-dotnet: false

      - name: Prepare Android export
        shell: bash
        run: |
          # Use the project at repository root.
          rm -rf godot

          # The icon is not present in the root project.
          sed -i '/^config\/icon=/d' project.godot

          mkdir -p .ci

          # Tell Godot explicitly where Java and Android SDK are installed.
          cat > .ci/editor_settings.cfg <<EOF
          [application]

          config/name="AGE OF TITANS"

          [export]

          [export/android]

          android_sdk_path="$ANDROID_HOME"
          java_sdk_path="$JAVA_HOME"
          adb="$ANDROID_HOME/platform-tools/adb"
          EOF

      - name: Check Godot project
        shell: bash
        run: |
          godot --version
          test -f project.godot
          test -f scenes/Main.tscn
          test -f scripts/main.gd
          test -f export_presets.cfg
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p build
          "$ANDROID_HOME/platform-tools/adb" start-server || true
          godot --headless --editor-settings .ci/editor_settings.cfg --path . --editor --quit
          godot --headless --editor-settings .ci/editor_settings.cfg --path . --export-debug "Android" build/AGE-OF-TITANS.apk

      - name: Verify APK
        shell: bash
        run: |
          test -f build/AGE-OF-TITANS.apk
          ls -lh build/AGE-OF-TITANS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AGE-OF-TITANS-APK
          path: build/AGE-OF-TITANS.apk
          if-no-files-found: error
