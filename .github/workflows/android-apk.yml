name: AGE OF TITANS - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Remove nested Godot project
        shell: bash
        run: |
          set -e
          rm -f godot/project.godot
          if [ -d godot ]; then
            rmdir godot 2>/dev/null || true
          fi
          test ! -e godot/project.godot

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager --sdk_root="$ANDROID_HOME" --licenses </dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f "$HOME/.android/debug.keystore"

      - name: Configure Godot 4.3 Android settings
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.config/godot"

          cat > /tmp/aot_ci_settings.gd <<'GDSCRIPT'
          extends SceneTree

          func _init():
              var settings = EditorInterface.get_editor_settings()
              settings.set_setting("export/android/java_sdk_path", OS.get_environment("JAVA_HOME"))
              settings.set_setting("export/android/android_sdk_path", OS.get_environment("ANDROID_HOME"))
              settings.set_setting("export/android/debug_keystore", OS.get_environment("GODOT_ANDROID_KEYSTORE_DEBUG_PATH"))
              settings.set_setting("export/android/debug_keystore_user", OS.get_environment("GODOT_ANDROID_KEYSTORE_DEBUG_USER"))
              settings.set_setting("export/android/debug_keystore_pass", OS.get_environment("GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD"))
              print("JAVA SDK: ", settings.get_setting("export/android/java_sdk_path"))
              print("ANDROID SDK: ", settings.get_setting("export/android/android_sdk_path"))
              print("DEBUG KEYSTORE: ", settings.get_setting("export/android/debug_keystore"))
              quit()
          GDSCRIPT

          godot --headless --editor --path . --script /tmp/aot_ci_settings.gd

      - name: Validate Android toolchain and export preset
        shell: bash
        run: |
          set -e
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/Main.tscn
          test -f scripts/main.gd
          test -d "$JAVA_HOME/bin"
          test -x "$JAVA_HOME/bin/java"
          test -f "$ANDROID_HOME/platform-tools/adb"
          test -f "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -f "$HOME/.android/debug.keystore"
          echo "Godot templates:"
          find "$HOME/.local/share/godot/export_templates" -maxdepth 3 -type f -name 'android_debug.apk' -print

      - name: Import Godot project
        shell: bash
        run: |
          set -e
          godot --headless --path . --editor --import --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -e
          mkdir -p build
          godot --headless --path . --verbose --export-debug "Android" build/AGE-OF-TITANS.apk

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -s build/AGE-OF-TITANS.apk
          file build/AGE-OF-TITANS.apk
          ls -lh build/AGE-OF-TITANS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AGE-OF-TITANS-APK
          path: build/AGE-OF-TITANS.apk
          if-no-files-found: error
