name: AGE OF TITANS - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager --sdk_root="$ANDROID_HOME" --licenses </dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          include-templates: true
          use-dotnet: false

      - name: Configure Android export environment
        shell: bash
        run: |
          set -e
          # Keep Godot's user configuration inside the runner workspace so the
          # exact settings file used by the export process is deterministic.
          export XDG_CONFIG_HOME="$RUNNER_TEMP/godot-config"
          mkdir -p "$XDG_CONFIG_HOME/godot" "$HOME/.android"
          echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> "$GITHUB_ENV"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          cat > "$XDG_CONFIG_HOME/godot/editor_settings-4.tres" <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/java_sdk_path = "$JAVA_HOME"
export/android/android_sdk_path = "$ANDROID_HOME"
EOF

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME"
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -f "$HOME/.android/debug.keystore"
          cat "$XDG_CONFIG_HOME/godot/editor_settings-4.tres"

      - name: Remove only nested Godot project file
        shell: bash
        run: |
          set -e
          # Do NOT delete the whole godot/ directory: it may contain game assets.
          rm -f godot/project.godot

      - name: Validate project
        shell: bash
        run: |
          set -e
          godot --version
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/Main.tscn
          test -f scripts/main.gd
          echo '--- Android export preset ---'
          cat export_presets.cfg

      - name: Import Godot project
        shell: bash
        run: |
          set -e
          godot --headless --path . --editor --import --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -e
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/AGE-OF-TITANS.apk

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -s build/AGE-OF-TITANS.apk
          file build/AGE-OF-TITANS.apk
          ls -lh build/AGE-OF-TITANS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AGE-OF-TITANS-APK
          path: build/AGE-OF-TITANS.apk
          if-no-files-found: error
