name: AGE OF TITANS - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Godot with Android templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          include-templates: true

      - name: Fix export preset for Godot 4.3
        shell: bash
        run: |
          python3 - <<'PY'
from pathlib import Path

p = Path("export_presets.cfg")
s = p.read_text()

if "[preset.0]" in s:
    block_start = s.index("[preset.0]")
    next_preset = s.find("\n[preset.", block_start + 1)
    if next_preset == -1:
        next_preset = len(s)
    block = s[block_start:next_preset]
    if "export_filter=" not in block:
        block = block.replace(
            "[preset.0]\n",
            '[preset.0]\nexport_filter="all_resources"\ninclude_filter=""\nexclude_filter=""\n',
            1
        )
        s = s[:block_start] + block + s[next_preset:]

p.write_text(s)
PY

      - name: Verify Godot
        run: |
          godot --version
          test -f export_presets.cfg

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android" build/AGE-OF-TITANS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AGE-OF-TITANS-APK
          path: build/AGE-OF-TITANS.apk
          if-no-files-found: error
