name: AGE OF TITANS - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Godot with Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Prepare project for export
        run: |
          # The repository contains an older nested Godot copy under godot/.
          # Export from the real root project only.
          test -f project.godot
          test -f scenes/Main.tscn
          test -f scripts/main.gd

          # The root project is self-contained and draws its visuals procedurally.
          # Remove references to optional icon files that are not present in this repository.
          sed -i '/^config\/icon=/d' project.godot
          sed -i '/^launcher_icons\//d' export_presets.cfg

          # Godot 4.3 expects these export filter keys in each preset.
          python3 - <<'PY2'
from pathlib import Path
p = Path("export_presets.cfg")
s = p.read_text()
if 'export_filter=' not in s:
    s = s.replace('[preset.0]\n', '[preset.0]\nexport_filter="all_resources"\ninclude_filter=""\nexclude_filter=""\n', 1)
p.write_text(s)
PY2

      - name: Verify Godot and templates
        run: |
          godot --version
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable" || true

      - name: Export Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android" build/AGE-OF-TITANS.apk
          test -f build/AGE-OF-TITANS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AGE-OF-TITANS-APK
          path: build/AGE-OF-TITANS.apk
          if-no-files-found: error
