name: AGE OF TITANS - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.0
          curl -L -o /tmp/templates.tpz             https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.3.0/

      - name: Export APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android" build/AGE-OF-TITANS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AGE-OF-TITANS-APK
          path: build/AGE-OF-TITANS.apk
          if-no-files-found: error
